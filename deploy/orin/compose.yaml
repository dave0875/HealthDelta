services:
  backend:
    image: ghcr.io/dave0875/healthdelta-backend:${HEALTHDELTA_BACKEND_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HEALTHDELTA_DATA_DIR: "/app/data"
      HEALTHDELTA_UPLOAD_TOKEN: "${HEALTHDELTA_UPLOAD_TOKEN:-}"
    volumes:
      - /opt/healthdelta/data:/app/data

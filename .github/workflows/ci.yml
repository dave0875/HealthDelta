name: CI

on:
  push:
  pull_request:

jobs:
  linux-tests:
    name: Linux (non-iOS tests)
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Issue footer in commit messages
        id: policy_issue_footer
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_issue_footer.py

      - name: Enforce PR Issue metadata
        id: policy_pr_issue
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_pr_issue.py

      - name: Enforce audit artifacts
        id: policy_audit_artifacts
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_audit_artifacts.py

      - name: Enforce prompt immutability
        id: policy_prompt_immutability
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_prompt_immutability.py

      - name: Enforce managed worktree policy
        id: policy_worktree
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/worktree_manager.py check

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install duckdb
          python3 -c 'import duckdb; print("duckdb_version=" + duckdb.__version__)'

      - name: Run non-iOS tests (headless)
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux
          python3 --version | tee artifacts/linux/python_version.txt

          set +e
          python3 -m unittest discover -s tests -p 'test_*.py' -v | tee artifacts/linux/unittest.log
          unittest_exit="${PIPESTATUS[0]}"
          set -e

          echo "UNITTEST_EXIT=$unittest_exit" >> "$GITHUB_ENV"

      - name: Run NDJSON validation smoke (artifact evidence)
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/observations.ndjson" <<'EOF'
          {"schema_version":2,"record_key":"rk1","canonical_person_id":"person-1","source":"fhir","source_system":"ss_smoke000001","source_file":"source/clinical/obs.json","event_time":"2020-01-01T00:00:00Z","run_id":"run-smoke"}
          EOF
          python3 -m healthdelta export validate --input "$tmpdir" > artifacts/linux/ndjson_validate.log 2>&1
          rm -rf "$tmpdir"

      - name: Run export profile smoke (artifact evidence)
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux/profile
          python3 -m healthdelta export profile \
            --input tests/fixtures/profile_export \
            --out artifacts/linux/profile \
            --sample-json 3 \
            --top-files 5 > artifacts/linux/profile_smoke.log 2>&1

      - name: Run backend vertical-slice smoke (artifact evidence)
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux/backend_slice
          python3 scripts/backend_slice_smoke.py \
            --input tests/fixtures/profile_export \
            --work artifacts/linux/backend_slice/work \
            --response artifacts/linux/backend_slice/summary_response.json \
            --log artifacts/linux/backend_slice/smoke.log

      - name: Run safety guardrail validation (artifact evidence)
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux/safety
          python3 scripts/check_safety_outputs.py \
            --input tests/fixtures/profile_export \
            --work artifacts/linux/safety/work \
            --out-json artifacts/linux/safety/safety_report.json \
            --out-log artifacts/linux/safety/safety.log

      - name: Upload Linux unittest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-unittest
          path: |
            artifacts/linux/python_version.txt
            artifacts/linux/unittest.log
            artifacts/linux/ndjson_validate.log
            artifacts/linux/profile_smoke.log
            artifacts/linux/profile/profile.json
            artifacts/linux/profile/profile.md
            artifacts/linux/profile/clinical_schema_keys.csv
            artifacts/linux/profile/sensitive_field_map.json
            artifacts/linux/backend_slice/smoke.log
            artifacts/linux/backend_slice/summary_response.json
            artifacts/linux/safety/safety_report.json
            artifacts/linux/safety/safety.log
          if-no-files-found: error

      - name: Fail if policy or unittest failed
        if: always()
        run: |
          set -euo pipefail
          policy_failed=0
          for outcome in \
            "${{ steps.policy_issue_footer.outcome }}" \
            "${{ steps.policy_pr_issue.outcome }}" \
            "${{ steps.policy_audit_artifacts.outcome }}" \
            "${{ steps.policy_prompt_immutability.outcome }}" \
            "${{ steps.policy_worktree.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              policy_failed=1
            fi
          done

          if [ "${UNITTEST_EXIT:-0}" != "0" ]; then
            echo "infra/test failure: unittest failed with exit code ${UNITTEST_EXIT}"
            exit "${UNITTEST_EXIT}"
          fi

          if [ "${policy_failed}" != "0" ]; then
            echo "policy failure: one or more governance checks failed."
            exit 1
          fi

  ios-xcode-tests:
    name: macOS (Xcode simulator tests)
    runs-on: [self-hosted, macOS, arm64, xcode]
    timeout-minutes: 60
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: List available simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available

      - name: Ensure xcodegen is available
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
            exit 0
          fi

          if command -v brew >/dev/null 2>&1; then
            brew install xcodegen
            xcodegen --version
            exit 0
          fi

          echo "ERROR: xcodegen is required but was not found, and Homebrew is not available."
          echo "See docs/runbook_xcode.md for runner setup."
          exit 1

      - name: Generate Xcode project (xcodegen)
        run: |
          set -euo pipefail
          (cd ios/HealthDelta && xcodegen generate)

      - name: Run xcodebuild tests (iPhone Simulator)
        run: |
          set -euo pipefail
          mkdir -p artifacts

          if [ -z "${DESTINATION:-}" ]; then
            DESTINATION="$(python3 -c 'import json,subprocess; data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"], text=True)); devices=[d["udid"] for runtime in (data.get("devices") or {}).values() for d in runtime if d.get("isAvailable") and "iPhone" in (d.get("name") or "") and d.get("udid")]; assert devices, "No available iPhone simulators found."; print(f"platform=iOS Simulator,id={devices[0]}")')"
          fi
          RESULT_BUNDLE_PATH="${RESULT_BUNDLE_PATH:-artifacts/HealthDelta.xcresult}"

          set +e
          xcodebuild test \
            -project ios/HealthDelta/HealthDelta.xcodeproj \
            -scheme HealthDelta \
            -destination "$DESTINATION" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            | tee artifacts/xcodebuild.log
          xcodebuild_exit="${PIPESTATUS[0]}"
          set -e

          echo "XCODEBUILD_EXIT=$xcodebuild_exit" >> "$GITHUB_ENV"

      - name: Export JUnit (if xcpretty available)
        if: always()
        run: |
          set -euo pipefail
          if [ -f artifacts/xcodebuild.log ] && command -v xcpretty >/dev/null 2>&1; then
            cat artifacts/xcodebuild.log | xcpretty --report junit --output artifacts/junit.xml
          else
            echo "xcpretty not found; skipping JUnit export (see docs/runbook_xcode.md)."
          fi

      - name: Upload xcresult + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: |
            artifacts/HealthDelta.xcresult
            artifacts/xcodebuild.log
            artifacts/junit.xml
          if-no-files-found: error

      - name: Fail if xcodebuild failed
        if: always()
        run: |
          set -euo pipefail
          if [ "${XCODEBUILD_EXIT:-0}" != "0" ]; then
            echo "xcodebuild failed with exit code ${XCODEBUILD_EXIT}"
            exit "${XCODEBUILD_EXIT}"
          fi

name: Deploy Backend (ORIN)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: orin-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ORIN deploy + verify
    runs-on: [self-hosted, linux, orin]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR (pull)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Derive deploy variables
        id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          ver="${tag#v}"
          sha="$(git rev-list -n 1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for GHCR tag availability
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/healthdelta-backend:${{ steps.v.outputs.tag }}"
          max_attempts=45
          delay_seconds=4
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "image available: $image"
              break
            fi
            echo "waiting for image manifest ($attempt/$max_attempts): $image"
            attempt=$((attempt + 1))
            sleep "$delay_seconds"
          done
          if [ "$attempt" -gt "$max_attempts" ]; then
            echo "ERROR: timed out waiting for image manifest: $image"
            exit 1
          fi

      - name: Deploy + verify (compose)
        run: |
          set -euo pipefail
          mkdir -p artifacts/orin-deploy
          TAG="${{ steps.v.outputs.tag }}" VERSION="${{ steps.v.outputs.ver }}" GIT_SHA="${{ steps.v.outputs.sha }}" \
            DEPLOY_DIR="/opt/healthdelta" SERVICE_NAME="backend" BASE_URL="http://127.0.0.1:8080" \
            bash scripts/cd/orin_deploy_backend.sh | tee artifacts/orin-deploy/deploy_verify.log

      - name: Capture endpoint response samples
        run: |
          set -euo pipefail
          mkdir -p artifacts/orin-deploy
          summary_payload='{"citation_limit":5,"input_path":"/app/tests/fixtures/profile_export"}'
          qa_payload='{"citation_limit":5,"input_path":"/app/tests/fixtures/profile_export","question":"what observations exist?"}'
          curl -fsS -X POST "http://127.0.0.1:8080/summary" -H "content-type: application/json" --data "$summary_payload" > artifacts/orin-deploy/summary_response.json
          curl -fsS -X POST "http://127.0.0.1:8080/qa" -H "content-type: application/json" --data "$qa_payload" > artifacts/orin-deploy/qa_response.json

      - name: Record deploy metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/orin-deploy
          {
            echo "tag=${{ steps.v.outputs.tag }}"
            echo "version=${{ steps.v.outputs.ver }}"
            echo "git_sha=${{ steps.v.outputs.sha }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > artifacts/orin-deploy/metadata.txt

      - name: Upload ORIN deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orin-deploy-proof
          path: |
            artifacts/orin-deploy/deploy_verify.log
            artifacts/orin-deploy/summary_response.json
            artifacts/orin-deploy/qa_response.json
            artifacts/orin-deploy/metadata.txt
          if-no-files-found: error

name: HealthDelta

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  HealthDelta:
    type: application
    platform: iOS
    sources:
      - path: Sources
    frameworks:
      - HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthdelta.app
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.0.1
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_ENTITLEMENTS: HealthDelta.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: HealthDelta reads your Health data to create a local export and sync summary on this device.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets:
        - HealthDeltaTests

  HealthDeltaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HealthDelta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
